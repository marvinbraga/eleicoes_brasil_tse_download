[project]
name = "eleicoes_brasil_tse_download"
version = "0.1.0"
description = "Baixa os zips abertos de uma eleição brasileira a partir do ano informado."
authors = [
    { name = "Marcus Braga", email = "mvbraga@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.1,<3",
    "python-dotenv>=1.2.4",
    "psycopg[c,pool]>=3.2,<4",
    "asn1tools>=0.169.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2,<3",
    "scikit-learn>=1.5,<2",
    "numpy>=2,<3",
    "alembic>=1.20.0,<2",
]

[project.scripts]
eleicoes = "eleicoes.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eleicoes"]

[tool.hatch.build.targets.wheel.force-include]
"src/eleicoes/adapters/orm/migrations/script.py.mako" = "eleicoes/adapters/orm/migrations/script.py.mako"
"src/eleicoes/adapters/sql/views.sql" = "eleicoes/adapters/sql/views.sql"
"src/eleicoes/adapters/asn1/bu.asn1" = "eleicoes/adapters/asn1/bu.asn1"
"src/eleicoes/adapters/asn1/rdv.asn1" = "eleicoes/adapters/asn1/rdv.asn1"
"src/eleicoes/adapters/asn1/assinatura.asn1" = "eleicoes/adapters/asn1/assinatura.asn1"
"src/eleicoes/adapters/asn1/autoridades_urna.pem" = "eleicoes/adapters/asn1/autoridades_urna.pem"

[tool.hatch.build.targets.sdist]
include = ["src/eleicoes", "tests", "pyproject.toml", ".env.example"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "SIM", "RET", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["eleicoes"]

[tool.ruff.lint.per-file-ignores]
"src/eleicoes/adapters/sklearn_ajuste.py" = ["E402"]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
python_version = "3.11"
mypy_path = "src"
packages = ["eleicoes"]
namespace_packages = false

[[tool.mypy.overrides]]
module = ["asn1tools", "asn1tools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "numpy", "numpy.*", "threadpoolctl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-branch --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]
