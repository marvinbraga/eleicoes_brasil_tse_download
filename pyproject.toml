[project]
name = "eleicoes_brasil_tse_download"
version = "0.1.0"
description = "Baixa os zips abertos de uma eleição brasileira a partir do ano informado."
authors = [
    { name = "Marcus Braga", email = "mvbraga@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.1,<3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
eleicoes = "eleicoes.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eleicoes"]

[tool.hatch.build.targets.sdist]
include = ["src/eleicoes", "tests", "pyproject.toml", ".env.example"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "SIM", "RET", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["eleicoes"]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
python_version = "3.11"
mypy_path = "src"
packages = ["eleicoes"]
namespace_packages = false

[tool.pytest.ini_options]
addopts = "--cov=src --cov-branch --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]
