name: eleicoes_brasil

services:
  postgres:
    image: postgres:17.11-alpine3.24
    env_file:
      - .env
    ports:
      - "${POSTGRES_PUBLISH_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - eleicoes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -v ON_ERROR_STOP=1 --username \"$$POSTGRES_USER\" --dbname metabase -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped

  importer:
    build:
      context: .
      dockerfile: Dockerfile
    image: eleicoes_brasil-importer:dev
    env_file:
      - .env
    command: ["sleep", "infinity"]
    volumes:
      - ./downloads:/data/downloads:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eleicoes
    healthcheck:
      test: ["CMD", "python", "-c", "import eleicoes"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.63.19.1
    env_file:
      - .env
    ports:
      - "${METABASE_PORT:-23000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eleicoes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  adminer:
    image: adminer:6.1.1
    env_file:
      - .env
    ports:
      - "${ADMINER_PORT:-28080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eleicoes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

networks:
  eleicoes:

volumes:
  postgres_data:
